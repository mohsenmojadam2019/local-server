name: GodControl CI

on:
  push:
    branches: [main, godcontrol-plugin-v1]
    paths:
      - "godcontrol/**"
      - "package.json"
      - ".github/workflows/godcontrol-ci.yml"
  pull_request:
    paths:
      - "godcontrol/**"
      - "package.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Existing project checks
        run: |
          npm run check
          npm test
      - name: Install GodControl dependencies
        working-directory: godcontrol
        run: npm ci --ignore-scripts
      - name: GodControl checks
        working-directory: godcontrol
        run: |
          npm run check
          npm test

      - name: MCP Inspector compatibility
        working-directory: godcontrol
        env:
          NODE_ENV: test
          GODCONTROL_DEV_AUTH: "true"
          GODCONTROL_DEVICE_HMAC_SECRET: ci-device-secret
          HOST: 127.0.0.1
          PORT: "8790"
          PUBLIC_ORIGIN: http://127.0.0.1:8790
        run: |
          node hub/server.js > /tmp/godcontrol-ci-hub.log 2>&1 &
          HUB_PID=$!
          trap 'kill "$HUB_PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8790/health >/dev/null && break
            sleep 0.2
          done
          npx --yes @modelcontextprotocol/inspector@2.5.0 --cli             http://127.0.0.1:8790/mcp --transport http --method tools/list --format json             | tee /tmp/godcontrol-tools.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/godcontrol-tools.json","utf8"));if(d.result.tools.length!==15)process.exit(1)'
