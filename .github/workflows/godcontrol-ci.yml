name: GodControl CI

on:
  push:
    branches: [main, godcontrol-plugin-v1]
    paths:
      - "godcontrol/**"
      - "package.json"
      - ".github/workflows/godcontrol-ci.yml"
  pull_request:
    paths:
      - "godcontrol/**"
      - "package.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install root dependencies
        run: npm ci
      - name: Existing project checks
        run: |
          npm run check
          npm test
      - name: Install GodControl dependencies
        working-directory: godcontrol
        run: npm install --ignore-scripts
      - name: GodControl checks
        working-directory: godcontrol
        run: |
          npm run check
          npm test
