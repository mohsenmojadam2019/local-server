server {
    listen 443 ssl http2;
    server_name mcp.redcoweb.ir;
    ssl_certificate /etc/letsencrypt/live/mcp.redcoweb.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mcp.redcoweb.ir/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / { proxy_pass http://127.0.0.1:19091; proxy_http_version 1.1; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto https; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 120s; }
}
